services:
  goldforge-mysql:
    image: mysql:8.0
    container_name: goldforge-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - goldforge_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  goldforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goldforge-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: goldforge-mysql
      DB_PORT: 3306
    ports:
      - "8080:8080"
    depends_on:
      goldforge-mysql:
        condition: service_healthy

volumes:
  goldforge_mysql_data:
    driver: local
