server:
  port: 8080

spring:
  application:
    name: finance-app

  datasource:
    url: jdbc:mariadb://localhost:3306/finance_db
    username: DB_USER
    password: DB_PASSWORD
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      indent_output: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
